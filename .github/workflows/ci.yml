name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Present for every step: `svelte-kit sync` only types the
      # `$env/static/private` exports that exist when it runs.
      GH_PINNED_TOKEN: ${{ secrets.GH_PINNED_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run check

      # `vite build` prerenders every route, so this step is what catches
      # server-only breakage such as a component reading $page.url.searchParams.
      - run: npm run build
        env:
          NODE_ENV: production
